  <!-- Lucide Icons -->

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            playerX: '#3b82f6', // Electric Blue
            playerO: '#ec4899', // Vibrant Pink
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-short': 'bounce 0.6s ease-in-out 1',
            'scale-in': 'scaleIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
          },
          keyframes: {
            scaleIn: {
              '0%': { transform: 'scale(0)', opacity: '0' },
              '100%': { transform: 'scale(1)', opacity: '1' }
            }
          }
        }
      }

  </script>

  <style>
    /* Glassmorphism custom styling */
    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .dark .glass-card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .cell-glow-x {
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.35);
    }
    .cell-glow-o {
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.35);
    }

    /* SVG Winning Line Animation */
    .win-line {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: dash 0.5s ease-out forwards;
    }

    @keyframes dash {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Prevent text highlight on mobile touch */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>

<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300 font-sans antialiased overflow-x-hidden">

  <!-- Firebase Integration Script Module -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, updateDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // PWA Manifest dynamic setup
    function setupPWA() {
      const manifestData = {
        name: "Tic-Tac-Toe Pro",
        short_name: "TicTacToe",
        description: "Professional Tic-Tac-Toe Game with Real-Time Online Multiplayer",
        start_url: "./",
        display: "standalone",
        background_color: "#0f172a",
        theme_color: "#0f172a",
        icons: [{
          src: document.getElementById('app-icon').href,
          sizes: "512x512",
          type: "image/svg+xml",
          purpose: "any maskable"
        }]
      };
      const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
      document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(manifestBlob));

      if ('serviceWorker' in navigator) {
        try {
          const swCode = `
            self.addEventListener('install', (e) => self.skipWaiting());
            self.addEventListener('activate', (e) => clients.claim());
            self.addEventListener('fetch', (e) => {
              e.respondWith(caches.match(e.request).then(res => res || fetch(e.request).catch(() => new Response("Offline"))));
            });
          `;
          const swBlob = new Blob([swCode], { type: 'text/javascript' });
          navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
        } catch(e) {}
      }
    }
    setupPWA();

    // Firebase Setup
    const firebaseConfig = typeof __firebase_config !== 'undefined'
      ? JSON.parse(__firebase_config)
      : {
          apiKey: "demo-key",
          authDomain: "demo.firebaseapp.com",
          projectId: "demo-project",
          storageBucket: "demo.appspot.com",
          messagingSenderId: "123456789",
          appId: "1:123456789:web:abcdef"
        };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

    let firebaseUser = null;
    let roomUnsubscribe = null;
    let currentRoomId = null;
    let playerRole = null; // 'X' or 'O'

    // Authenticate First
    async function initAuth() {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (err) {
        console.error("Auth Error:", err);
      }
    }

    onAuthStateChanged(auth, (user) => {
      firebaseUser = user;
      const netStatus = document.getElementById('network-status');
      if (user) {
        netStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> Online`;
        netStatus.className = "text-[11px] font-bold text-emerald-500 flex items-center gap-1";
      } else {
        netStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-slate-400"></span> Offline`;
        netStatus.className = "text-[11px] font-bold text-slate-400 flex items-center gap-1";
      }
    });

    initAuth();

    // Audio Engine
    class AudioFX {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }

      playTone(freq, type, duration, gainVal = 0.1) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }

      playX() { this.playTone(520, 'sine', 0.15, 0.15); }
      playO() { this.playTone(330, 'triangle', 0.2, 0.2); }
      playWin() {
        if (!this.enabled) return;
        [440, 554.37, 659.25, 880].forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 'sine', 0.25, 0.15), idx * 90);
        });
      }
      playTie() {
        if (!this.enabled) return;
        [300, 260, 220].forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 'sawtooth', 0.2, 0.08), idx * 80);
        });
      }
    }

    function initGame() {
      board = Array(9).fill(null);
      currentPlayer = 'X';
      isGameActive = true;
      history = [];

        cell.innerHTML = '';

    function updateTurnStatusUI() {
      if (!isGameActive) return;

      if (gameMode === 'online') {
        if (!currentRoomId) {
          statusText.innerText = "Create or Join a Room";
          statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-slate-400";
          return;
        }
        if (currentPlayer === playerRole) {
          statusText.innerText = "Your Turn (" + playerRole + ")";
          statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
        } else {
          statusText.innerText = "Opponent's Turn (" + currentPlayer + ")";
          statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse";
        }
      } else {
        if (currentPlayer === 'X') {
          statusText.innerText = "Player X's Turn";
          statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse";
        } else {
          statusText.innerText = gameMode === 'ai' ? "AI is Thinking..." : "Player O's Turn";
          statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-pink-500 animate-pulse";
        }
      }

      if (currentPlayer === 'X') {
        scoreCardX.classList.add('scale-105', 'shadow-blue-500/20');
        scoreCardO.classList.remove('scale-105', 'shadow-pink-500/20');
      } else {
        scoreCardO.classList.add('scale-105', 'shadow-pink-500/20');
        scoreCardX.classList.remove('scale-105', 'shadow-blue-500/20');
      }
    }

    function handleCellClick(index) {
      if (!isGameActive || board[index] !== null) return;

      if (gameMode === 'online') {
        if (!currentRoomId || currentPlayer !== playerRole) {
          showToast(currentPlayer !== playerRole ? "Wait for your turn!" : "Join a room first!");
          return;
        }
        makeOnlineMove(index);
        return;
      }

      if (gameMode === 'ai' && currentPlayer === 'O') return;

      makeMove(index, currentPlayer);

      if (isGameActive && gameMode === 'ai' && currentPlayer === 'O') {
        updateTurnStatusUI();
        const delay = Math.floor(Math.random() * 200) + 300;
        setTimeout(() => {
          if (!isGameActive) return;
          const aiMove = getAIMove();
          if (aiMove !== null && aiMove !== undefined) {
            makeMove(aiMove, 'O');
          }
        }, delay);
      }
    }

    function makeMove(index, player) {
      history.push([...board]);
      updateUndoButton();

      board[index] = player;
      cells[index].innerHTML = player === 'X' ? getXSVG() : getOSVG();

      if (player === 'X') soundEngine.playX();
      else soundEngine.playO();

      const winInfo = checkWin(board);

      if (winInfo) {
        handleWin(winInfo);
      } else if (board.every(cell => cell !== null)) {
        handleTie();
      } else {
        currentPlayer = player === 'X' ? 'O' : 'X';
        updateTurnStatusUI();
      }
    }

    function handleUndo() {
      if (!isGameActive || history.length === 0 || gameMode === 'online') return;

      if (gameMode === 'ai') {
        if (history.length >= 2) {
          board = history.pop();
          board = history.pop();
        } else if (history.length === 1) {
          board = history.pop();
        }
        currentPlayer = 'X';
      } else {
        board = history.pop();
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      }

      cells.forEach((cell, idx) => {
        const val = board[idx];
        cell.innerHTML = val === 'X' ? getXSVG() : (val === 'O' ? getOSVG() : '');
      });

      updateTurnStatusUI();
      updateUndoButton();
    }

    function updateUndoButton() {
      undoBtn.disabled = history.length === 0 || !isGameActive || gameMode === 'online';
    }

    function checkWin(currentBoard) {
      for (let i = 0; i < WINNING_COMBOS.length; i++) {
        const [a, b, c] = WINNING_COMBOS[i];
        if (currentBoard[a] && currentBoard[a] === currentBoard[b] && currentBoard[a] === currentBoard[c]) {
          return { winner: currentBoard[a], combo: [a, b, c], comboIndex: i };
        }
      }
      return null;
    }

    function handleWin(winInfo) {
      isGameActive = false;
      const winner = winInfo.winner;
      stats[winner.toLowerCase()]++;
      saveStats();
      updateScoreboardUI();
      soundEngine.playWin();

      drawWinningLine(winInfo.comboIndex, winner);
      winInfo.combo.forEach(idx => {
        cells[idx].classList.add(winner === 'X' ? 'cell-glow-x' : 'cell-glow-o');
      });

      cells.forEach((cell, idx) => {
        if (!winInfo.combo.includes(idx)) cell.classList.add('opacity-50');
      });

      if (gameMode === 'online') {
        statusText.innerText = winner === playerRole ? "You Won!" : "Opponent Won!";
      } else {
        statusText.innerText = winner === 'X' ? 'Player X Wins!' : (gameMode === 'ai' ? 'AI Wins!' : 'Player O Wins!');
      }
      statusIndicator.className = `w-2.5 h-2.5 rounded-full ${winner === 'X' ? 'bg-blue-500' : 'bg-pink-500'}`;

      if (typeof confetti === 'function') {
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6 },
          colors: winner === 'X' ? ['#3b82f6', '#60a5fa'] : ['#ec4899', '#f472b6']
        });
      }
      updateUndoButton();
    }

    function handleTie() {
      isGameActive = false;
      stats.ties++;
      saveStats();
      updateScoreboardUI();
      soundEngine.playTie();

      statusText.innerText = "It's a Draw!";
      statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-slate-400";
      cells.forEach(cell => cell.classList.add('opacity-60'));
      updateUndoButton();
    }

    function drawWinningLine(comboIndex, winner) {
      const coords = [
        { x1: 20, y1: 50, x2: 280, y2: 50 },
        { x1: 20, y1: 150, x2: 280, y2: 150 },
        { x1: 20, y1: 250, x2: 280, y2: 250 },
        { x1: 50, y1: 20, x2: 50, y2: 280 },
        { x1: 150, y1: 20, x2: 150, y2: 280 },
        { x1: 250, y1: 20, x2: 250, y2: 280 },
        { x1: 30, y1: 30, x2: 270, y2: 270 },
        { x1: 270, y1: 30, x2: 30, y2: 270 }
      ];

      const line = coords[comboIndex];
      winningLine.setAttribute('x1', line.x1);
      winningLine.setAttribute('y1', line.y1);
      winningLine.setAttribute('x2', line.x2);
      winningLine.setAttribute('y2', line.y2);
      winningLine.setAttribute('stroke', winner === 'X' ? '#3b82f6' : '#ec4899');
      winningLine.classList.remove('hidden');
      winningLine.classList.add('win-line');
    }

    function hideWinningLine() {
      winningLine.classList.add('hidden');
      winningLine.classList.remove('win-line');
    }

    // AI Minimax
    function getAIMove() {
      const emptyIndices = board.map((val, idx) => val === null ? idx : null).filter(val => val !== null);
      if (emptyIndices.length === 0) return null;

      if (difficulty === 'easy') {
        return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
      }
      if (difficulty === 'medium' && Math.random() < 0.4) {
        return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
      }

      let bestScore = -Infinity;
      let move = null;
      for (let i = 0; i < 9; i++) {
        if (board[i] === null) {
          board[i] = 'O';
          let score = minimax(board, 0, false, -Infinity, Infinity);
          board[i] = null;
          if (score > bestScore) {
            bestScore = score;
            move = i;
          }
        }
      }
      return move;
    }

    function minimax(tempBoard, depth, isMaximizing, alpha, beta) {
      const winInfo = checkWin(tempBoard);
      if (winInfo) return winInfo.winner === 'O' ? (10 - depth) : (depth - 10);
      if (tempBoard.every(cell => cell !== null)) return 0;

      if (isMaximizing) {
        let maxEval = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (tempBoard[i] === null) {
            tempBoard[i] = 'O';
            let evaluation = minimax(tempBoard, depth + 1, false, alpha, beta);
            tempBoard[i] = null;
            maxEval = Math.max(maxEval, evaluation);
            alpha = Math.max(alpha, evaluation);
            if (beta <= alpha) break;
          }
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (let i = 0; i < 9; i++) {
          if (tempBoard[i] === null) {
            tempBoard[i] = 'X';
            let evaluation = minimax(tempBoard, depth + 1, true, alpha, beta);
            tempBoard[i] = null;
            minEval = Math.min(minEval, evaluation);
            beta = Math.min(beta, evaluation);
            if (beta <= alpha) break;
          }
        }
        return minEval;
      }
    }

    // ONLINE MULTIPLAYER LOGIC (FIRESTORE)
    function generateRoomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 6; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    async function createOnlineRoom() {
      if (!firebaseUser) {
        showToast("Connecting to cloud service...");
        await initAuth();
        if (!firebaseUser) {
          showToast("Cloud connection error. Try again.");
          return;
        }
      }

      const roomCode = generateRoomCode();
      const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

      const initialRoomState = {
        board: Array(9).fill(""),
        turn: 'X',
        playerX: firebaseUser.uid,
        playerO: null,
        status: 'waiting',
        winner: null,
        createdAt: Date.now()
      };

      try {
        await setDoc(roomRef, initialRoomState);
        playerRole = 'X';
        currentRoomId = roomCode;
        displayRoomCode.innerText = roomCode;
        onlineInitialControls.classList.add('hidden');
        onlineActiveControls.classList.remove('hidden');
        subscribeToRoom(roomCode);
        labelPlayerX.innerText = "You (X)";
        labelPlayerO.innerText = "Waiting...";
        showToast("Room created! Share code: " + roomCode);
      } catch (e) {
        console.error("Create room error:", e);
        showToast("Failed to create room.");
      }
    }

    async function joinOnlineRoom() {
      const code = roomCodeInput.value.trim().toUpperCase();
      if (!code || code.length !== 6) {
        showToast("Enter a valid 6-character room code");
        return;
      }

      if (!firebaseUser) {
        await initAuth();
        if (!firebaseUser) return;
      }

      const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);

      try {
        await updateDoc(roomRef, {
          playerO: firebaseUser.uid,
          status: 'playing'
        });
        playerRole = 'O';
        currentRoomId = code;
        displayRoomCode.innerText = code;
        onlineInitialControls.classList.add('hidden');
        onlineActiveControls.classList.remove('hidden');
        subscribeToRoom(code);
        labelPlayerX.innerText = "Opponent (X)";
        labelPlayerO.innerText = "You (O)";
        showToast("Joined room successfully!");
      } catch (e) {
        console.error("Join room error:", e);
        showToast("Room not found or game in progress.");
      }
    }

    function subscribeToRoom(code) {
      if (roomUnsubscribe) roomUnsubscribe();

      const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);

      roomUnsubscribe = onSnapshot(roomRef, (snapshot) => {
        if (!snapshot.exists()) {
          showToast("Room closed by host.");
          leaveOnlineRoom();
          return;
        }

        const data = snapshot.data();
        
        // Sync board
        const syncBoard = data.board.map(val => val === "" ? null : val);
        board = syncBoard;

        // Render UI cells
        cells.forEach((cell, idx) => {
          const val = board[idx];
          cell.innerHTML = val === 'X' ? getXSVG() : (val === 'O' ? getOSVG() : '');
        });

        currentPlayer = data.turn;

        if (data.status === 'waiting') {
          labelPlayerO.innerText = "Waiting...";
          statusText.innerText = "Waiting for Opponent...";
          statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse";
        } else if (data.status === 'playing') {
          if (playerRole === 'X') labelPlayerO.innerText = "Opponent (O)";
          else labelPlayerX.innerText = "Opponent (X)";

          isGameActive = true;
          const winInfo = checkWin(board);
          if (winInfo) {
            handleWin(winInfo);
          } else if (board.every(cell => cell !== null)) {
            handleTie();
          } else {
            hideWinningLine();
            updateTurnStatusUI();
          }
        }
      }, (err) => {
        console.error("Snapshot error:", err);
      });
    }

    async function makeOnlineMove(index) {
      if (!currentRoomId || board[index] !== null) return;

      const newBoard = [...board];
      newBoard[index] = playerRole;

      const nextTurn = playerRole === 'X' ? 'O' : 'X';
      const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId);

      const winInfo = checkWin(newBoard);
      const isTie = newBoard.every(cell => cell !== null);

      try {
        await updateDoc(roomRef, {
          board: newBoard.map(v => v === null ? "" : v),
          turn: nextTurn,
          status: (winInfo || isTie) ? 'finished' : 'playing',
          winner: winInfo ? playerRole : null
        });
      } catch (e) {
        console.error("Move sync error:", e);
      }
    }

    async function resetOnlineGame() {
      if (!currentRoomId) return;

      const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId);
      try {
        await updateDoc(roomRef, {
          board: Array(9).fill(""),
          turn: 'X',
          status: 'playing',
          winner: null
        });
        showToast("New online match started!");
      } catch (e) {
        console.error("Reset online game error:", e);
      }
    }

    function leaveOnlineRoom() {
      if (roomUnsubscribe) {
        roomUnsubscribe();
        roomUnsubscribe = null;
      }
      currentRoomId = null;
      playerRole = null;
      onlineActiveControls.classList.add('hidden');
      onlineInitialControls.classList.remove('hidden');
      labelPlayerX.innerText = "Player X";
      labelPlayerO.innerText = "AI (O)";
      initGame();
      showToast("Left online room");

      localStorage.setItem('ttt_pro_theme', isDark ? 'dark' : 'light');
      updateThemeIcon();
    });

    soundBtn.addEventListener('click', () => {
      soundEngine.enabled = !soundEngine.enabled;
      localStorage.setItem('ttt_pro_sound', soundEngine.enabled ? 'true' : 'false');
      updateSoundIcon();
    });

    resetStatsBtn.addEventListener('click', () => {
      stats = { x: 0, o: 0, ties: 0 };
      saveStats();
      updateScoreboardUI();
    });

    window.onload = () => {
      lucide.createIcons();
      loadSavedState();
      initGame();
    };
  </script>
</body>
</html>
