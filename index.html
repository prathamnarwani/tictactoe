  <script>
    function setupPWA() {
      try {
        const manifestData = {
          name: "Tic-Tac-Toe Pro",
          short_name: "TicTacToe",
          description: "Professional Tic-Tac-Toe Game with Real-Time Online Multiplayer",
          start_url: "./",
          display: "standalone",
          background_color: "#0f172a",
          theme_color: "#0f172a",
          icons: [{
            src: document.getElementById('app-icon').href,
            sizes: "512x512",
            type: "image/svg+xml",
            purpose: "any maskable"
          }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
        document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(manifestBlob));
      } catch (e) {}
    }
    setupPWA();

    class AudioFX {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      playTone(freq, type, duration, gainVal = 0.1) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }

      playX() { this.playTone(520, 'sine', 0.15, 0.15); }
      playO() { this.playTone(330, 'triangle', 0.2, 0.2); }
      playWin() {
        if (!this.enabled) return;
        [440, 554.37, 659.25, 880].forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 'sine', 0.25, 0.15), idx * 90);
        });
      }
      playTie() {
        if (!this.enabled) return;
        [300, 260, 220].forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 'sawtooth', 0.2, 0.08), idx * 80);
        });
      }
    }

    const soundEngine = new AudioFX();

    const WINNING_COMBOS = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    let board = Array(9).fill(null);
    let currentPlayer = 'X';
    let isGameActive = true;
    let gameMode = 'ai';
    let difficulty = 'unbeatable';
    let history = [];
    let aiTimeoutId = null;

    let mqttClient = null;
    let isWebsocketBlocked = false;
    let myClientId = 'user_' + Math.random().toString(36).substr(2, 9);
    let currentRoomId = null;
    let playerRole = null;
    let currentTopic = null;

    const localChannel = new BroadcastChannel('ttt_canvas_local_sync');

    localChannel.onmessage = (event) => {
      if (event.data && event.data.roomId === currentRoomId && event.data.senderId !== myClientId) {
        handleNetworkPayload(event.data);
      }
    };

    let stats = { x: 0, o: 0, ties: 0 };

    const cells = document.querySelectorAll('.game-cell');
    const statusText = document.getElementById('status-text');
    const statusIndicator = document.getElementById('status-indicator');
    const scoreXEl = document.getElementById('score-x');
    const scoreOEl = document.getElementById('score-o');
    const scoreTiesEl = document.getElementById('score-ties');
    const labelPlayerX = document.getElementById('label-player-x');
    const labelPlayerO = document.getElementById('label-player-o');
    const modeAiBtn = document.getElementById('mode-ai');
    const modePvpBtn = document.getElementById('mode-pvp');
    const modeOnlineBtn = document.getElementById('mode-online');
    const difficultyWrapper = document.getElementById('difficulty-wrapper');
    const difficultySelect = document.getElementById('difficulty-select');
    const onlineWrapper = document.getElementById('online-wrapper');
    const onlineInitialControls = document.getElementById('online-initial-controls');
    const onlineActiveControls = document.getElementById('online-active-controls');
    const createRoomBtn = document.getElementById('create-room-btn');
    const joinRoomBtn = document.getElementById('join-room-btn');
    const leaveRoomBtn = document.getElementById('leave-room-btn');
    const roomCodeInput = document.getElementById('room-code-input');
    const displayRoomCode = document.getElementById('display-room-code');
    const copyRoomBtn = document.getElementById('copy-room-btn');
    const restartBtn = document.getElementById('restart-btn');
    const undoBtn = document.getElementById('undo-btn');
    const themeBtn = document.getElementById('theme-btn');
    const soundBtn = document.getElementById('sound-btn');
    const resetStatsBtn = document.getElementById('reset-stats-btn');
    const winningLine = document.getElementById('winning-line');
    const scoreCardX = document.getElementById('score-card-x');
    const scoreCardO = document.getElementById('score-card-o');

    function showToast(msg) {
      const toast = document.getElementById('toast-message');
      document.getElementById('toast-text').innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 3500);
    }

    function getXSVG() {
      return `<svg class="w-12 h-12 sm:w-16 sm:h-16 text-playerX animate-scale-in" viewBox="0 0 100 100">
        <path d="M 20 20 L 80 80 M 80 20 L 20 80" stroke="currentColor" stroke-width="16" stroke-linecap="round"/>
      </svg>`;
    }

    function getOSVG() {
      return `<svg class="w-12 h-12 sm:w-16 sm:h-16 text-playerO animate-scale-in" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="32" stroke="currentColor" stroke-width="16" fill="none" stroke-linecap="round"/>
      </svg>`;
    }

    function initGame() {
      if (aiTimeoutId) {
        clearTimeout(aiTimeoutId);
        aiTimeoutId = null;
      }
      board = Array(9).fill(null);
      currentPlayer = 'X';
      isGameActive = true;
      history = [];
      hideWinningLine();
      cells.forEach(cell => {
        cell.innerHTML = '';
        cell.classList.remove('cell-glow-x', 'cell-glow-o', 'opacity-50', 'opacity-60');
      });
      updateTurnStatusUI();
      updateUndoButton();
    }

    function updateTurnStatusUI() {
      if (!isGameActive) return;

      if (gameMode === 'online') {
        if (!currentRoomId) {
          statusText.innerText = "Create or Join a Room";
          statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-slate-400";
          return;
        }
        if (currentPlayer === playerRole) {
          statusText.innerText = "Your Turn (" + playerRole + ")";
          statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
        } else {
          statusText.innerText = "Opponent's Turn (" + currentPlayer + ")";
          statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse";
        }
      } else {
        if (currentPlayer === 'X') {
          statusText.innerText = "Player X's Turn";
          statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse";
        } else {
          statusText.innerText = gameMode === 'ai' ? "AI is Thinking..." : "Player O's Turn";
          statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-pink-500 animate-pulse";
        }
      }

      if (currentPlayer === 'X') {
        scoreCardX.classList.add('scale-105', 'shadow-blue-500/20');
        scoreCardO.classList.remove('scale-105', 'shadow-pink-500/20');
      } else {
        scoreCardO.classList.add('scale-105', 'shadow-pink-500/20');
        scoreCardX.classList.remove('scale-105', 'shadow-blue-500/20');
      }
    }

    function handleCellClick(index) {
      if (!isGameActive || board[index] !== null) return;

      soundEngine.init();

      if (gameMode === 'online') {
        if (!currentRoomId || currentPlayer !== playerRole) {
          showToast(currentPlayer !== playerRole ? "Wait for your turn!" : "Join a room first!");
          return;
        }
        makeOnlineMove(index);
        return;
      }

      if (gameMode === 'ai' && currentPlayer === 'O') return;

      makeMove(index, currentPlayer);

      if (isGameActive && gameMode === 'ai' && currentPlayer === 'O') {
        updateTurnStatusUI();
        const delay = Math.floor(Math.random() * 200) + 300;
        aiTimeoutId = setTimeout(() => {
          aiTimeoutId = null;
          if (!isGameActive || gameMode !== 'ai') return;
          const aiMove = getAIMove();
          if (aiMove !== null && aiMove !== undefined) {
            makeMove(aiMove, 'O');
          }
        }, delay);
      }
    }

    function makeMove(index, player) {
      history.push([...board]);
      updateUndoButton();

      board[index] = player;
      cells[index].innerHTML = player === 'X' ? getXSVG() : getOSVG();

      if (player === 'X') soundEngine.playX();
      else soundEngine.playO();

      const winInfo = checkWin(board);

      if (winInfo) {
        handleWin(winInfo);
      } else if (board.every(cell => cell !== null)) {
        handleTie();
      } else {
        currentPlayer = player === 'X' ? 'O' : 'X';
        updateTurnStatusUI();
      }
    }

    function handleUndo() {
      if (!isGameActive || history.length === 0 || gameMode === 'online') return;

      if (aiTimeoutId) {
        clearTimeout(aiTimeoutId);
        aiTimeoutId = null;
      }

      if (gameMode === 'ai') {
        if (history.length >= 2) {
          board = history.pop();
          board = history.pop();
        } else if (history.length === 1) {
          board = history.pop();
        }
        currentPlayer = 'X';
      } else {
        board = history.pop();
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      }

      cells.forEach((cell, idx) => {
        const val = board[idx];
        cell.innerHTML = val === 'X' ? getXSVG() : (val === 'O' ? getOSVG() : '');
      });

      updateTurnStatusUI();
      updateUndoButton();
    }

    function updateUndoButton() {
      undoBtn.disabled = history.length === 0 || !isGameActive || gameMode === 'online';
    }

    function checkWin(currentBoard) {
      for (let i = 0; i < WINNING_COMBOS.length; i++) {
        const [a, b, c] = WINNING_COMBOS[i];
        if (currentBoard[a] && currentBoard[a] === currentBoard[b] && currentBoard[a] === currentBoard[c]) {
          return { winner: currentBoard[a], combo: [a, b, c], comboIndex: i };
        }
      }
      return null;
    }

    function handleWin(winInfo) {
      isGameActive = false;
      if (aiTimeoutId) {
        clearTimeout(aiTimeoutId);
        aiTimeoutId = null;
      }
      const winner = winInfo.winner;
      stats[winner.toLowerCase()]++;
      saveStats();
      updateScoreboardUI();
      soundEngine.playWin();

      drawWinningLine(winInfo.comboIndex, winner);
      winInfo.combo.forEach(idx => {
        cells[idx].classList.add(winner === 'X' ? 'cell-glow-x' : 'cell-glow-o');
      });

      cells.forEach((cell, idx) => {
        if (!winInfo.combo.includes(idx)) cell.classList.add('opacity-50');
      });

      if (gameMode === 'online') {
        statusText.innerText = winner === playerRole ? "You Won!" : "Opponent Won!";
      } else {
        statusText.innerText = winner === 'X' ? 'Player X Wins!' : (gameMode === 'ai' ? 'AI Wins!' : 'Player O Wins!');
      }
      statusIndicator.className = `w-2.5 h-2.5 rounded-full ${winner === 'X' ? 'bg-blue-500' : 'bg-pink-500'}`;

      if (typeof confetti === 'function') {
        try {
          confetti({
            particleCount: 80,
            spread: 70,
            origin: { y: 0.6 },
            colors: winner === 'X' ? ['#3b82f6', '#60a5fa'] : ['#ec4899', '#f472b6']
          });
        } catch(e){}
      }
      updateUndoButton();
    }

    function handleTie() {
      isGameActive = false;
      if (aiTimeoutId) {
        clearTimeout(aiTimeoutId);
        aiTimeoutId = null;
      }
      stats.ties++;
      saveStats();
      updateScoreboardUI();
      soundEngine.playTie();

      statusText.innerText = "It's a Draw!";
      statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-slate-400";
      cells.forEach(cell => cell.classList.add('opacity-60'));
      updateUndoButton();
    }

    function drawWinningLine(comboIndex, winner) {
      const coords = [
        { x1: 20, y1: 50, x2: 280, y2: 50 },
        { x1: 20, y1: 150, x2: 280, y2: 150 },
        { x1: 20, y1: 250, x2: 280, y2: 250 },
        { x1: 50, y1: 20, x2: 50, y2: 280 },
        { x1: 150, y1: 20, x2: 150, y2: 280 },
        { x1: 250, y1: 20, x2: 250, y2: 280 },
        { x1: 30, y1: 30, x2: 270, y2: 270 },
        { x1: 270, y1: 30, x2: 30, y2: 270 }
      ];

      const line = coords[comboIndex];
      winningLine.setAttribute('x1', line.x1);
      winningLine.setAttribute('y1', line.y1);
      winningLine.setAttribute('x2', line.x2);
      winningLine.setAttribute('y2', line.y2);
      winningLine.setAttribute('stroke', winner === 'X' ? '#3b82f6' : '#ec4899');
      winningLine.classList.remove('hidden');
      winningLine.classList.add('win-line');
    }

    function hideWinningLine() {
      winningLine.classList.add('hidden');
      winningLine.classList.remove('win-line');
    }

    function getAIMove() {
      const emptyIndices = board.map((val, idx) => val === null ? idx : null).filter(val => val !== null);
      if (emptyIndices.length === 0) return null;

      if (difficulty === 'easy') {
        return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
      }
      if (difficulty === 'medium' && Math.random() < 0.4) {
        return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
      }

      let bestScore = -Infinity;
      let move = emptyIndices[0];
      for (let i = 0; i < 9; i++) {
        if (board[i] === null) {
          board[i] = 'O';
          let score = minimax(board, 0, false, -Infinity, Infinity);
          board[i] = null;
          if (score > bestScore) {
            bestScore = score;
            move = i;
          }
        }
      }
      return move;
    }

    function minimax(tempBoard, depth, isMaximizing, alpha, beta) {
      const winInfo = checkWin(tempBoard);
      if (winInfo) return winInfo.winner === 'O' ? (10 - depth) : (depth - 10);
      if (tempBoard.every(cell => cell !== null)) return 0;

      if (isMaximizing) {
        let maxEval = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (tempBoard[i] === null) {
            tempBoard[i] = 'O';
            let evaluation = minimax(tempBoard, depth + 1, false, alpha, beta);
            tempBoard[i] = null;
            maxEval = Math.max(maxEval, evaluation);
            alpha = Math.max(alpha, evaluation);
            if (beta <= alpha) break;
          }
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (let i = 0; i < 9; i++) {
          if (tempBoard[i] === null) {
            tempBoard[i] = 'X';
            let evaluation = minimax(tempBoard, depth + 1, true, alpha, beta);
            tempBoard[i] = null;
            minEval = Math.min(minEval, evaluation);
            beta = Math.min(beta, evaluation);
            if (beta <= alpha) break;
          }
        }
        return minEval;
      }
    }

    function generateRoomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 6; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    function updateNetworkStatusUI(status, isLive) {
      const netStatus = document.getElementById('network-status');
      netStatus.innerHTML = `<span class="w-2 h-2 rounded-full ${isLive ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}"></span> ${status}`;
      netStatus.className = `text-[11px] font-bold ${isLive ? 'text-emerald-500' : 'text-amber-500'} flex items-center gap-1`;
    }

    function initMQTTNetwork() {
      if (mqttClient || isWebsocketBlocked) return;
      
      try {
        if (typeof mqtt === 'undefined') {
          isWebsocketBlocked = true;
          updateNetworkStatusUI('Local Sync Active', false);
          return;
        }

        mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
          clientId: myClientId,
          keepalive: 60,
          clean: true,
          connectTimeout: 4000,
          reconnectPeriod: 2000
        });

        mqttClient.on('connect', () => {
          updateNetworkStatusUI('Network Active', true);
        });

        mqttClient.on('error', () => {
          isWebsocketBlocked = true;
          updateNetworkStatusUI('Local Sync Active', false);
          if (mqttClient) {
            try { mqttClient.end(true); } catch(e){}
            mqttClient = null;
          }
        });

        mqttClient.on('message', (topic, message) => {
          try {
            const data = JSON.parse(message.toString());
            if (data.senderId === myClientId) return;
            handleNetworkPayload(data);
          } catch(e) {}
        });
      } catch (e) {
        isWebsocketBlocked = true;
        updateNetworkStatusUI('Local Sync Active', false);
      }
    }

    function publishMessage(payload) {
      payload.senderId = myClientId;
      payload.roomId = currentRoomId;

      localChannel.postMessage(payload);

      if (mqttClient && currentTopic && !isWebsocketBlocked) {
        try {
          mqttClient.publish(currentTopic, JSON.stringify(payload));
        } catch(e) {}
      }
    }

    function handleNetworkPayload(data) {
      if (data.type === 'JOIN_REQUEST') {
        labelPlayerO.innerText = "Opponent (O)";
        showToast("Opponent joined!");
        publishMessage({
          type: 'GAME_STATE',
          board: board,
          turn: currentPlayer,
          isGameActive: isGameActive
        });
      } else if (data.type === 'GAME_STATE') {
        board = data.board;
        currentPlayer = data.turn;
        isGameActive = data.isGameActive;

        cells.forEach((cell, idx) => {
          const val = board[idx];
          cell.innerHTML = val === 'X' ? getXSVG() : (val === 'O' ? getOSVG() : '');
        });

        const winInfo = checkWin(board);
        if (winInfo) {
          handleWin(winInfo);
        } else if (board.every(cell => cell !== null)) {
          handleTie();
        } else {
          hideWinningLine();
          updateTurnStatusUI();
        }
      } else if (data.type === 'MAKE_MOVE') {
        board[data.index] = data.player;
        cells[data.index].innerHTML = data.player === 'X' ? getXSVG() : getOSVG();

        if (data.player === 'X') soundEngine.playX();
        else soundEngine.playO();

        const winInfo = checkWin(board);
        if (winInfo) {
          handleWin(winInfo);
        } else if (board.every(cell => cell !== null)) {
          handleTie();
        } else {
          currentPlayer = data.player === 'X' ? 'O' : 'X';
          updateTurnStatusUI();
        }
      } else if (data.type === 'RESET_MATCH') {
        initGame();
        showToast("Opponent restarted match!");
      } else if (data.type === 'LEAVE_ROOM') {
        labelPlayerO.innerText = "Waiting...";
        showToast("Opponent left room");
      }
    }

    function createOnlineRoom() {
      initMQTTNetwork();
      const code = generateRoomCode();
      currentRoomId = code;
      currentTopic = 'tictactoe_pro_game_v1/' + code;
      playerRole = 'X';

      if (mqttClient && !isWebsocketBlocked) {
        try { mqttClient.subscribe(currentTopic); } catch(e){}
      }

      displayRoomCode.innerText = code;
      onlineInitialControls.classList.add('hidden');
      onlineActiveControls.classList.remove('hidden');

      labelPlayerX.innerText = "You (X)";
      labelPlayerO.innerText = "Waiting...";

      initGame();
      showToast("Room created! Code: " + code);
    }

    function joinOnlineRoom(providedCode) {
      initMQTTNetwork();
      const code = (providedCode || roomCodeInput.value).trim().toUpperCase();
      if (!code || code.length !== 6) {
        showToast("Enter a 6-character room code");
        return;
      }

      currentRoomId = code;
      currentTopic = 'tictactoe_pro_game_v1/' + code;
      playerRole = 'O';

      if (mqttClient && !isWebsocketBlocked) {
        try { mqttClient.subscribe(currentTopic); } catch(e){}
      }

      displayRoomCode.innerText = code;
      onlineInitialControls.classList.add('hidden');
      onlineActiveControls.classList.remove('hidden');

      labelPlayerX.innerText = "Opponent (X)";
      labelPlayerO.innerText = "You (O)";

      initGame();

      setTimeout(() => {
        publishMessage({ type: 'JOIN_REQUEST' });
      }, 300);

      showToast("Joined room " + code);
    }

    function makeOnlineMove(index) {
      if (!currentRoomId || board[index] !== null || !isGameActive) return;

      board[index] = playerRole;
      cells[index].innerHTML = playerRole === 'X' ? getXSVG() : getOSVG();

      if (playerRole === 'X') soundEngine.playX();
      else soundEngine.playO();

      publishMessage({
        type: 'MAKE_MOVE',
        index: index,
        player: playerRole
      });

      const winInfo = checkWin(board);
      if (winInfo) {
        handleWin(winInfo);
      } else if (board.every(cell => cell !== null)) {
        handleTie();
      } else {
        currentPlayer = playerRole === 'X' ? 'O' : 'X';
        updateTurnStatusUI();
      }
    }

    function resetOnlineGame() {
      initGame();
      publishMessage({ type: 'RESET_MATCH' });
      showToast("New match started!");
    }

    function leaveOnlineRoom() {
      if (mqttClient && currentTopic && !isWebsocketBlocked) {
        publishMessage({ type: 'LEAVE_ROOM' });
        try { mqttClient.unsubscribe(currentTopic); } catch(e){}
      }
      currentRoomId = null;
      currentTopic = null;
      playerRole = null;
      onlineActiveControls.classList.add('hidden');
      onlineInitialControls.classList.remove('hidden');
      labelPlayerX.innerText = "Player X";
      labelPlayerO.innerText = "AI (O)";
      initGame();
      showToast("Left online room");
    }

    function loadSavedState() {
      const savedStats = localStorage.getItem('ttt_pro_stats');
      if (savedStats) {
        try { stats = JSON.parse(savedStats); } catch(e){}
      }
      const savedTheme = localStorage.getItem('ttt_pro_theme');
      if (savedTheme === 'light') document.documentElement.classList.remove('dark');
      else document.documentElement.classList.add('dark');

      const savedSound = localStorage.getItem('ttt_pro_sound');
      if (savedSound === 'false') soundEngine.enabled = false;

      updateThemeIcon();
      updateSoundIcon();
      updateScoreboardUI();
    }

    function saveStats() {
      localStorage.setItem('ttt_pro_stats', JSON.stringify(stats));
    }

    function updateScoreboardUI() {
      scoreXEl.innerText = stats.x;
      scoreOEl.innerText = stats.o;
      scoreTiesEl.innerText = stats.ties;
    }

    function updateThemeIcon() {
      const isDark = document.documentElement.classList.contains('dark');
      themeBtn.innerHTML = isDark
        ? `<i data-lucide="sun" class="w-4 h-4 sm:w-5 sm:h-5"></i>`
        : `<i data-lucide="moon" class="w-4 h-4 sm:w-5 sm:h-5"></i>`;
      if (window.lucide) lucide.createIcons();
    }

    function updateSoundIcon() {
      soundBtn.innerHTML = soundEngine.enabled
        ? `<i data-lucide="volume-2" class="w-4 h-4 sm:w-5 sm:h-5"></i>`
        : `<i data-lucide="volume-x" class="w-4 h-4 sm:w-5 sm:h-5 text-red-400"></i>`;
      if (window.lucide) lucide.createIcons();
    }

    cells.forEach(cell => {
      cell.addEventListener('click', () => {
        const index = parseInt(cell.getAttribute('data-cell'));
        handleCellClick(index);
      });
    });

    restartBtn.addEventListener('click', () => {
      soundEngine.init();
      if (gameMode === 'online' && currentRoomId) {
        resetOnlineGame();
      } else {
        initGame();
      }
    });

    undoBtn.addEventListener('click', handleUndo);

    modeAiBtn.addEventListener('click', () => {
      soundEngine.init();
      if (gameMode === 'online') leaveOnlineRoom();
      gameMode = 'ai';
      modeAiBtn.className = "py-1.5 rounded-lg text-center transition font-bold bg-white dark:bg-slate-800 text-blue-600 dark:text-blue-400 shadow-sm";
      modePvpBtn.className = "py-1.5 rounded-lg text-center transition font-bold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
      modeOnlineBtn.className = "py-1.5 rounded-lg text-center transition font-bold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center justify-center gap-1";
      difficultyWrapper.classList.remove('hidden');
      onlineWrapper.classList.add('hidden');
      labelPlayerX.innerText = "Player X";
      labelPlayerO.innerText = "AI (O)";
      initGame();
    });

    modePvpBtn.addEventListener('click', () => {
      soundEngine.init();
      if (gameMode === 'online') leaveOnlineRoom();
      gameMode = 'pvp';
      modePvpBtn.className = "py-1.5 rounded-lg text-center transition font-bold bg-white dark:bg-slate-800 text-blue-600 dark:text-blue-400 shadow-sm";
      modeAiBtn.className = "py-1.5 rounded-lg text-center transition font-bold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
      modeOnlineBtn.className = "py-1.5 rounded-lg text-center transition font-bold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center justify-center gap-1";
      difficultyWrapper.classList.add('hidden');
      onlineWrapper.classList.add('hidden');
      labelPlayerX.innerText = "Player X";
      labelPlayerO.innerText = "Player O";
      initGame();
    });

    modeOnlineBtn.addEventListener('click', () => {
      soundEngine.init();
      gameMode = 'online';
      modeOnlineBtn.className = "py-1.5 rounded-lg text-center transition font-bold bg-white dark:bg-slate-800 text-blue-600 dark:text-blue-400 shadow-sm flex items-center justify-center gap-1";
      modeAiBtn.className = "py-1.5 rounded-lg text-center transition font-bold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
      modePvpBtn.className = "py-1.5 rounded-lg text-center transition font-bold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
      difficultyWrapper.classList.add('hidden');
      onlineWrapper.classList.remove('hidden');
      initGame();
      initMQTTNetwork();
    });

    difficultySelect.addEventListener('change', (e) => {
      difficulty = e.target.value;
      initGame();
    });

    createRoomBtn.addEventListener('click', createOnlineRoom);
    joinRoomBtn.addEventListener('click', () => joinOnlineRoom());
    leaveRoomBtn.addEventListener('click', leaveOnlineRoom);

    copyRoomBtn.addEventListener('click', () => {
      if (!currentRoomId) return;
      const shareUrl = window.location.origin + window.location.pathname + '?room=' + currentRoomId;
      try {
        const tempInput = document.createElement('input');
        tempInput.value = shareUrl;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        showToast("Invite link copied!");
      } catch (e) {
        showToast("Room code: " + currentRoomId);
      }
    });

    themeBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('ttt_pro_theme', isDark ? 'dark' : 'light');
      updateThemeIcon();
    });

    soundBtn.addEventListener('click', () => {
      soundEngine.enabled = !soundEngine.enabled;
      if (soundEngine.enabled) soundEngine.init();
      localStorage.setItem('ttt_pro_sound', soundEngine.enabled ? 'true' : 'false');
      updateSoundIcon();
    });

    resetStatsBtn.addEventListener('click', () => {
      stats = { x: 0, o: 0, ties: 0 };
      saveStats();
      updateScoreboardUI();
    });

    window.onload = () => {
      if (window.lucide) lucide.createIcons();
      loadSavedState();
      initGame();

      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      if (roomParam && roomParam.length === 6) {
        modeOnlineBtn.click();
        joinOnlineRoom(roomParam);
      }
    };
  </script>
